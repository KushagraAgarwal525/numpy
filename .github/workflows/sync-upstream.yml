# Fork-only: keep main aligned with numpy/numpy every day.
name: Sync upstream main

on:
  schedule:
    # 00:30 UTC ≈ 06:00 IST — after typical upstream merge traffic
    - cron: "30 0 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream-main
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'KushagraAgarwal525/numpy'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream/main into main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/numpy/numpy.git
          git fetch upstream main --tags

          git checkout main
          git pull --ff-only origin main || git pull origin main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream/main"
            exit 0
          fi

          # Preserve fork-only Cloud Agent files (.cursor/, AGENTS.md) via merge.
          git merge upstream/main -m "chore: sync upstream/main $(date -u +%Y-%m-%d) [skip ci]"

          git push origin main
